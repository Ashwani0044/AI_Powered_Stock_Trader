name: Trading Verse CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create temporary .env file
        run: |
          echo "FLASK_APP=app.py" >> backend/.env
          echo "FLASK_ENV=development" >> backend/.env
          echo "DATABASE_URL=postgresql://user:password@db:5432/trading_db" >> backend/.env
          echo "REDIS_URL=redis://redis:6379/0" >> backend/.env
          echo "JWT_SECRET_KEY=test_secret" >> backend/.env
          echo "GEMINI_API_KEY=dummy_key" >> backend/.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Spin up Docker Compose
        run: docker compose up -d --build

      - name: Backend Health Check
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:5000/health; then
              echo "Backend is UP!"
              exit 0
            fi
            echo "Waiting for backend... (attempt $i)"
            sleep 3
          done
          echo "Backend failed to start in time."
          docker compose logs backend
          exit 1

      - name: Run Backend Tests
        run: docker compose exec -T backend pytest

      - name: Docker Down
        run: docker compose down
